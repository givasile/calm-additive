  .span { fill: var(--fg); opacity: .08; }
  .link { stroke: var(--muted); stroke-width: 1.2; opacity: .6; }
  .mk-calm { fill: var(--s1); stroke: var(--bg); stroke-width: 1.2; } .mk-ga2m { fill: var(--bg); stroke: var(--s2); stroke-width: 1.7; }
</style>
