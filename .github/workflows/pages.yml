name: Pages

# The landing page (docs/) at /calm-additive/ and the documentation
# (documentation/, MkDocs) under /calm-additive/docs/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Landing page
        run: mkdir -p _site && cp -r docs/. _site/

      - name: Documentation
        run: uv run --python 3.12 --group docs mkdocs build -f documentation/mkdocs.yml --strict -d "$GITHUB_WORKSPACE/_site/docs"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
